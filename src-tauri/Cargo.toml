[package]
name = "app"
version = "3.0.1"
description = "F1 Coach — native shell"
authors = ["F1 Coach"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "boxbox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# Native "Save As" file dialog so exported laps/sessions go where the driver
# chooses instead of silently landing in Downloads. The chosen path is written
# by our own `write_text_file` command (below), so no fs-plugin scope is needed.
tauri-plugin-dialog = "2"
# Lock-free hand-off of the latest telemetry snapshot from the UDP thread to the
# FFB thread (and the UI emitter) — no mutex on the real-time read path.
arc-swap = "1"
# Force-feedback output to the wheel via SDL2's haptic API. `bundled` builds SDL2
# from source and `static-link` folds it into the exe, so no SDL2.dll is shipped
# (needs the MSVC C compiler + CMake, already installed).
sdl2 = { version = "0.36", features = ["bundled", "static-link"] }
# Enumerate this machine's LAN IPv4 addresses so console players can see which
# address to point the game's telemetry output at (the app runs on a 2nd device).
local-ip-address = "0.6"
