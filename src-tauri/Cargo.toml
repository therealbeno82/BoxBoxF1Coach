[package]
name = "app"
version = "4.2.0-beta.1"
description = "F1 Coach — native shell"
authors = ["F1 Coach"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "boxbox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# Native "Save As" file dialog so exported laps/sessions go where the driver
# chooses instead of silently landing in Downloads. The chosen path is written
# by our own `write_text_file` command (below), so no fs-plugin scope is needed.
tauri-plugin-dialog = "2"
# Lock-free hand-off of the latest telemetry snapshot from the UDP thread to the
# FFB thread (and the UI emitter) — no mutex on the real-time read path.
arc-swap = "1"
# Enumerate this machine's LAN IPv4 addresses so console players can see which
# address to point the game's telemetry output at (the app runs on a 2nd device).
# Portable: routes through getifaddrs on Android too, so it stays unconditional.
local-ip-address = "0.6"

# Force-feedback output to the wheel via SDL2's haptic API. `bundled` builds SDL2
# from source and `static-link` folds it into the exe, so no SDL2.dll is shipped
# (needs the MSVC C compiler + CMake, already installed). That C build can't
# cross-compile to Android, and FFB is desktop-only anyway, so the dep is gated
# off there — `ffb/wheel.rs` is the crate's only `sdl2` reference.
#
# NOTE the cfg keys on `target_os`, NOT on tauri's `desktop`/`mobile`. Those are
# `cargo:rustc-cfg` values emitted by tauri-build when the crate COMPILES; Cargo
# reads dependency tables at RESOLUTION time, before any build script runs, so it
# has never heard of them. Code gating uses `#[cfg(desktop)]`; deps can't.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sdl2 = { version = "0.36", features = ["bundled", "static-link"] }

# The Android bridge — platform TTS (Kokoro and the ONNX runtime are stripped from
# that bundle), FLAG_KEEP_SCREEN_ON, and the Wi-Fi multicast lock. It carries a
# Kotlin Gradle library project; declaring it here is also what publishes that
# project into `gen/android/tauri.settings.gradle`, which is generated from the
# dependency graph rather than edited.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-f1android = { path = "../tauri-plugin-f1android" }
