<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the Android build draw under the status bar and
         gesture pill; the Shell then pays that back with env(safe-area-inset-*)
         padding. Without it the app is letterboxed by system bars on a phone. -->
    <!-- maximum-scale/user-scalable: this is an app shell, not a document. The
         WebView's default double-tap-to-zoom and pinch-zoom fire on ordinary
         taps and drags here — a tap on a pill, a drag of the scrubber or the 3D
         orbit camera — and leave the layout scaled up with no obvious way back.
         The UI already reflows for the viewport, so page zoom adds nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>F1 Coach</title>
    <!-- UI fonts are SELF-HOSTED (public/fonts/, vendored by
         scripts/fetch-fonts.mjs). They used to come from fonts.googleapis.com,
         which made every launch wait on a render-blocking network request — the
         app has to work offline (UDP telemetry + a bundled TTS model need no
         network), and offline that request stalled until it timed out and then
         fell back to system-ui. Keep this local: re-run the script to change the
         family/weight set, don't re-add the remote <link>. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      /* ─── COCKPIT DESIGN TOKENS ───────────────────────────────────────────
         These :root values are the DEFAULT skin — the original committed dark
         navy/blue palette. Team skins (src/lib/ui/skins.js) override a subset of
         these custom properties on <html> at runtime; anything a skin doesn't set
         falls back to the value here, so the Default skin === this palette exactly.
         Screens read the same tokens via src/lib/ui/tokens.js (the var()-backed
         `C` object). Data-semantic colours (reference purple, driven cyan, sector
         + delta + telemetry-channel colours) are fixed literals in tokens.js and
         are never skinned. */
      :root {
        /* Surfaces (skinnable) */
        --bg:             #0b0e14;  /* app background */
        --glow:           #131a2b;  /* radial glow behind the body content */
        --surface:        #11151d;  /* primary card */
        --inset:          #0d1119;  /* inset / well / nested tile */
        --elevated:       #16243f;  /* active / selected (accent-tinted) */
        --modal:          #0e121b;  /* overlay cards */

        /* Borders (skinnable) */
        --line:           #1c2230;  /* hairline card border */
        --border-input:   #232a3a;
        --border-strong:  #2b3346;
        --border-modal:   #262c3a;  /* floating nav / switcher bar */

        /* Text (fixed — neutral tones read the same across every skin) */
        --text:           #ffffff;
        --text-dim:       #d6dbe8;
        --text-mid:       #aeb6c6;
        --text-muted:     #8b94a8;
        --text-faint:     #6b7488;
        --text-faintest:  #5b6478;

        /* Brand accent (skinnable) */
        --accent:         #3671C6;  /* brand blue — CTAs, active nav, accent bars */
        --on-accent:      #ffffff;  /* foreground on top of --accent fills */
        --accent-glow:    rgba(54,113,198,.33);
        --accent-0d:      rgba(54,113,198,.05);
        --accent-1f:      rgba(54,113,198,.12);
        --accent-33:      rgba(54,113,198,.20);
        --accent-44:      rgba(54,113,198,.27);
        --accent-55:      rgba(54,113,198,.33);
        --secondary:      #b45bff;  /* reference / coach purple */

        /* Dashboard hero treatment (skinnable; Default keeps today's soft look) */
        --hero-border:    #1c2230;
        --pb-border:      #2c2150;  /* personal-best highlighted row */
        --num-italic:     normal;   /* italicised race numerals for some liveries */
        --r-lg:           16px;     /* radius scale — team skins flatten to 8px */
        --r-md:           14px;
        --r-sm:           10px;
        --tex-hero:       none;     /* carbon-weave hero texture (team skins only) */

        /* ─── Responsive sizing tokens ──────────────────────────────────────
           The app styles with inline React style objects, which cannot carry a
           media query — so any value that must change with viewport width is
           routed through a custom property and switched HERE. This costs no
           re-render, unlike the JS breakpoint hook (hooks/useViewport.jsx),
           which is reserved for changes to the MARKUP itself (the nav becoming
           a bottom tab bar, modals becoming sheets).

           Note the inline style must actually read `var(--x)` for this to bite:
           an inline literal beats a stylesheet rule in the cascade, so a media
           query alone can never override `gridTemplateColumns: "repeat(6,1fr)"`. */
        --col-min:          320px;  /* flex column floor — the main cause of side-scroll on a phone */
        --screen-px:        28px;   /* each screen's own left/right padding */
        --grid-live-tiles:  repeat(6, 1fr);  /* Live's KPI strip */
        --grid-live-sectors: repeat(3, 1fr); /* Live's three sector cards */
        /* Leaderboard row: pos · driver · lap · gap · S1 S2 S3 · tyre · use */
        --grid-board-row:   48px 1fr 108px 92px repeat(3, 70px) 96px 128px;
        /* Minimum interactive height. Read ONLY inside the `pointer: coarse`
           block below, so this value is what a mouse-driven build would use if
           it ever asked — which it never does. */
        --tap:              32px;
      }

      /* Tablet — the layout still works, it just needs fewer columns. */
      @media (max-width: 1023px) {
        :root {
          --col-min:         260px;
          --grid-live-tiles: repeat(3, 1fr);
          --screen-px:       18px;
        }
      }

      /* Phone. The column floor goes to zero: it exists to stop flex children
         collapsing on a wide desktop, but `flex: 1 1 <basis>` already does that
         job, and at 400 px a 320 px floor is exactly what forces a sideways
         scroll. */
      @media (max-width: 639px) {
        :root {
          --col-min:          0px;
          /* 28px each side costs 56px of a ~400px screen — the single cheapest
             width win available. */
          --screen-px:        10px;
          /* All six readouts on ONE line. Vertical space is the scarce one on a
             phone, and at ~53px per cell the values still clear their widest case
             ("300 km/h") — so the strip costs one row instead of three. */
          --grid-live-tiles:  repeat(6, 1fr);
          /* Five columns; .lb-secondary hides the four cells that fall outside,
             so the cell count and the column count stay in step — a grid with
             more children than columns spills into implicit ROWS rather than
             hiding anything, which would break the row apart. */
          --grid-board-row:   24px 1fr 68px 52px 32px;
        }
        .lb-secondary { display: none; }
      }

      /* Nothing on a touch screen should be smaller than a fingertip. This works
         because the buttons carry inline `padding` but no inline `min-height`, so
         the stylesheet rule wins uncontested. Keyed on pointer type, not width —
         a touch laptop is wide AND coarse.
         The VALUE has to be pointer-keyed too, and once wasn't: `--tap: 44px`
         lived in the max-width:639px block, so rotating a phone to landscape
         (873 CSS px wide) dropped every control back to the 32px desktop floor —
         measured at 30px on the nav buttons. A fingertip does not get smaller
         when the screen turns sideways. */
      @media (pointer: coarse) {
        :root { --tap: 44px; }
        button, [role="button"], select, input[type="checkbox"], input[type="radio"] {
          min-height: var(--tap);
        }
        /* Range inputs need the thumb reachable, not the track tall. */
        input[type="range"] { min-height: var(--tap); }
      }

      * { box-sizing: border-box; }
      /* Smooth reskin: fade colour changes ONLY while a skin swap is in flight —
         applySkin (src/lib/ui/skins.js) holds .reskin on <html> for ~240 ms.
         Scoped, not universal: an always-on `*` transition would also animate
         every live data-driven colour change (deltas, gauges, 30 Hz telemetry
         readouts) and make the style engine track transitions on the whole tree.
         Inline `transition` styles on individual elements still win over this. */
      html.reskin * { transition: background-color .16s ease, border-color .16s ease, color .16s ease; }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        /* `manipulation` drops the double-tap-to-zoom gesture, which is what makes
           a WebView hold every tap for ~300ms to see if a second one is coming —
           so this also removes the tap delay on every button in the app. */
        touch-action: manipulation;
      }
      body {
        font-family: "Archivo", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        /* Stops Android enlarging text in tall blocks on its own, which changes
           the sizes the phone layout was measured at. */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      /* ─── Animations (from the handoff) ─────────────────────────────────── */
      @keyframes blink { 0%,60%{opacity:1} 61%,100%{opacity:.25} }
      @keyframes sweep { from{transform:translateX(-100%)} to{transform:translateX(300%)} }
      @keyframes coachPulse { 0%,100%{opacity:.3;transform:translateY(0)} 50%{opacity:1;transform:translateY(-2px)} }

      /* ─── Thin custom scrollbars ────────────────────────────────────────── */
      * { scrollbar-width: thin; scrollbar-color: #2a3346 transparent; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2a3346; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: #3a4761; background-clip: padding-box; }
      ::-webkit-scrollbar-corner { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
